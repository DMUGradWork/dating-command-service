spring:
  # H2 Database Configuration (로컬 테스트용)
  datasource:
    url: jdbc:h2:mem:dating_command_local
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop

  # Kafka 비활성화 (로컬 테스트용)
  kafka:
    bootstrap-servers: localhost:9092
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

logging:
  level:
    com.grewmeet.dating.datingcommandservice: DEBUG
